<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Assistant</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --user-bubble: #2563eb;
      --user-text: #ffffff;
      --bot-bubble: #ffffff;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #b91c1c;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .chat-shell {
      width: 100%;
      max-width: 720px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .chat-header {
      padding: 16px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .chat-header h1 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .chat-header span {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 12px 15px;
      border-radius: var(--radius);
      font-size: 0.95rem;
      line-height: 1.5;
      box-shadow: var(--shadow);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-row.user .bubble {
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .message-row.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .bubble.error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.84rem;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .chip:hover {
      background: var(--surface-subtle);
      border-color: var(--primary);
    }

    .composer {
      padding: 14px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      position: sticky;
      bottom: 0;
    }

    .composer input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .composer input:focus {
      border-color: var(--primary);
    }

    .composer button {
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .composer button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .composer button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main class="chat-shell">
    <header class="chat-header">
      <h1>Weather Chatbot</h1>
      <span>Ask about any city</span>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div class="message-row bot">
        <div class="bubble">
          Ask me for the weather in any city.
          <div class="chips" id="chips">
            <button type="button" class="chip" data-query="Weather in Bengaluru">Weather in Bengaluru</button>
            <button type="button" class="chip" data-query="Weather in Mumbai">Weather in Mumbai</button>
            <button type="button" class="chip" data-query="Weather in London">Weather in London</button>
          </div>
        </div>
      </div>
    </section>

    <form method = "POST" id="chat-form" class="composer">
      <input
        id="user-input"
        type="text"
        placeholder="e.g., What's the weather in Bengaluru?"
        autocomplete="off"
        required
      />
      <button id="send-btn" type="submit">Send</button>
    </form>
  </main>

  <script>
    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    function appendMessage(role, text, isError = false) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = `bubble${isError ? " error" : ""}`;
      bubble.textContent = text;

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    async function sendMessage(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      appendMessage("user", trimmed);
      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;

      const loadingRow = appendMessage("bot", "Looking up your request...");

      try {
        const response = await fetch("/weather/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: trimmed })
        });

        const replyText = await response.text();
        loadingRow.remove();

        if (!response.ok) {
          appendMessage("bot", replyText || "Could not get weather details.", true);
          return;
        }

        appendMessage("bot", replyText || "(Empty response)");
      } catch (err) {
        loadingRow.remove();
        appendMessage("bot", "Network error: unable to reach the server.", true);
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(inputEl.value);
    });

    document.getElementById("chips")?.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (btn) sendMessage(btn.dataset.query);
    });
  </script>
</body>
</html>
